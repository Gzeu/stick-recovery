[package]
name = "stick-recovery"
version = "0.1.0"
edition = "2021"
description = "Advanced cross-platform USB stick data recovery tool"
authors = ["Gzeu"]
license = "MIT"
repository = "https://github.com/Gzeu/stick-recovery"

[dependencies]
# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Cross-platform file system operations
dirs = "5.0"

# Image Processing
image = "0.25"

# Compression
zip = "2.1"
flate2 = "1.0"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Date/time handling
chrono = "0.4"

# Progress reporting
indicatif = "0.17"

# Hex manipulation
hex = "0.4"

# Binary parsing
bincode = "1.3"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
